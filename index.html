<!DOCTYPE html>
<!-- TODO: PERSONALIZAR TODO O FORMULÁRIO -->
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Meus Lembretes</title>

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <main class="container">
            <header class="header">
                <div>
                    <h1>Meus Lembretes</h1>
                    <p>Gerenciamento de lembretes</p>
                </div>

                <div class="form-actions">
                    <button id="btnImprimir" class="btn btn-secondary"> Imprimir </button>
                    <button id="btnNovo" class="btn btn-primary"> + Novo lembrete </button>
                </div>                
            </header>

            <!-- FORMULÁRIO -->
            <section id="formulario" class="card hidden">
                <h2 id="tituloFormulario">Novo lembrete</h2>

                <form id="formLembrete">
                    <input type="hidden" id="lembreteId">
                    <div class="form-group">
                        <label for="descricao"> Descrição </label>
                        <input type="text" id="descricao" placeholder="Digite o lembrete..." maxlength="500" required>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btnCancelar" class="btn btn-secondary"> Cancelar </button>
                        <button type="submit" class="btn btn-primary"> Salvar </button>
                    </div>
                </form>
            </section>

            <!-- FILTRO -->
            <section class="card">
                <div class="filtro">
                    <div class="form-group">
                        <label for="filtroDescricao"> Descrição </label>

                        <input type="text" id="filtroDescricao" placeholder="Pesquisar...">
                    </div>

                    <div class="form-group">
                        <label for="tamanhoPagina"> Registros por página </label>

                        <select id="tamanhoPagina">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>

                    <button id="btnFiltrar" class="btn btn-primary"> Filtrar </button>
                </div>
            </section>

            <!-- LISTAGEM -->
            <section class="card">
                <div class="table-header">
                    <h2>Lembretes</h2>

                    <span id="totalRegistros"> 0 registros </span>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Cadastro</th>
                                <th>Atualização</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="listaLembretes">
                        </tbody>
                    </table>

                    <div id="mensagemVazia" class="empty hidden"> Nenhum lembrete encontrado. </div>
                </div>

                <!-- PAGINAÇÃO -->
                <div class="pagination">
                    <button id="btnAnterior" class="btn btn-secondary"> ← Anterior </button>
                    <span id="paginaAtual"> Página 1 </span>
                    <button id="btnProximo" class="btn btn-secondary"> Próxima → </button>
                </div>
            </section>
        </main>

        <!-- TOAST -->
        <div id="toast" class="toast hidden"></div>
        <script src="js/app.js"></script>
    </body>
</html>
